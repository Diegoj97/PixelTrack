<div class="app-container">
  <header class="header">
    <h1>PixelTrack</h1>
  </header>
  <app-navbar></app-navbar>

  <main class="game-board">
    <app-album-image [imageUrl]="currentAlbumImage" [genre]="currentGenre"></app-album-image>
    <app-board [word]="currentArtistName"></app-board>
  </main>

  <app-key-board (keyPress)="onKeyPress($event)"></app-key-board>

  <footer class="footer">
    <p>Simple. Grid. PixelTrack.</p>
  </footer>
</div>
