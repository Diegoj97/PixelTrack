<div class="navbar-container">
  <div class="left-section">
    <button class="nav-btn language-btn" (click)="onToggleFlags()" [disabled]="hasAttempted" [class.disabled]="hasAttempted">
      <span class="lang-text">{{ currentLang }}</span>
      
      <img *ngIf="currentFlag" [src]="currentFlag" class="flag-icon-img" alt="Flag">
    </button>
    <button class="nav-btn icon-btn" aria-label="Multiplayer">
      <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24">
        <path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/>
      </svg>
    </button>
  </div>

  <div class="center-section">
    <!-- Optional: Title could go here if needed, but user didn't ask for it in the navbar specifically, 
         though usually it's there. I'll leave it empty or put the title if the user wants to replace the header completely. 
         The user asked for a navbar component, I will assume it replaces the header title or sits above it. 
         Looking at the image, there is no title in the navbar row. -->
  </div>

  <div class="right-section">
    <button class="nav-btn icon-btn" aria-label="Podium">
