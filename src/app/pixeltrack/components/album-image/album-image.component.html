<div class="genre-display" *ngIf="genre">
  <span class="genre-label">{{ label }}:</span> <span class="genre-value">{{ genre }}</span>
</div>

<div class="album-container">
  <img *ngIf="imageUrl" [src]="imageUrl" class="album-art" [style.filter]="'blur(' + blurAmount + 'px)'" alt="Album Art" />
  <div *ngIf="!imageUrl" class="placeholder-image">
    <span>Album Art</span>
  </div>
</div>
